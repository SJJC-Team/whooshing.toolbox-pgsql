name: Unit Test
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request: { types: [opened, reopened, synchronize, ready_for_review] }
  push: { branches: [ develop ] }

jobs:
  unit-tests:
    uses: SJJC-Team/ci/.github/workflows/run-unit-tests.yml@develop
    with:
      ios_scheme_name: whooshing.toolbox-pgsql
      work_dir: "."

      with_release_mode_testing: true
      with_tsan: true
      with_musl: true
      extra_musl_flags: --target PgSQL
      with_api_check: true
      ios_xcodebuild_action: ''
      
      with_pg_configs: |
        testing testing testing 5432

    secrets: inherit
